<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Cadastro — Teste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0e14; --surface: #10151f; --surface2: #161c28;
            --border: #1f2b3a; --primary: #7dd3c0; --accent: #f0b86e;
            --text: #e2e8f0; --muted: #64748b; --radius: 10px;
            --red: #f87171; --green: #4ade80;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        header {background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;}
        .back-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; white-space: nowrap; transition: color 0.2s;}
        .back-link:hover { color: var(--primary);}
        header h1 { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        header p  { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; display: grid; gap: 1.5rem; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
        .card h2 { font-size: .9rem; font-weight: 700; margin-bottom: 1rem; color: var(--accent); display: flex; align-items: center; gap: .5rem; }
        label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .3rem; margin-top: .75rem; font-weight: 500; }
        input { width: 100%; padding: .55rem .8rem; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 7px; color: var(--text); font-size: .88rem; outline: none; transition: border-color .2s; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; margin-top: 1rem; padding: .6rem; background: var(--primary); color: #0a0e14; border: none; border-radius: 7px; font-size: .88rem; font-weight: 700; cursor: pointer; transition: opacity .2s; }
        .btn:hover { opacity: .85; }
        .btn.outline { background: none; border: 1.5px solid var(--primary); color: var(--primary); }

        /* Response */
        .response-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-top: 1.5rem; }
        .response-box h3 { font-size: .8rem; color: var(--muted); margin-bottom: .75rem; }
        pre { font-family: 'JetBrains Mono', monospace; font-size: .78rem; white-space: pre-wrap; word-break: break-word; color: var(--text); }
        .status-badge { display: inline-block; font-size: .7rem; font-weight: 700; padding: .15rem .5rem; border-radius: 999px; margin-left: .5rem; }
        .ok  { background: rgba(74,222,128,.15); color: var(--green); }
        .err { background: rgba(248,113,113,.15); color: var(--red); }

        /* Users table */
        .users-table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: .5rem; }
        .users-table th { text-align: left; padding: .4rem .6rem; color: var(--muted); font-size: .72rem; font-weight: 600; border-bottom: 1px solid var(--border); }
        .users-table td { padding: .45rem .6rem; border-bottom: 1px solid var(--border); }
        .users-table tr:last-child td { border-bottom: none; }
        .btn-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: .8rem; font-weight: 600; }
        .btn-del:hover { text-decoration: underline; }
        .empty-users { color: var(--muted); font-size: .82rem; padding: .75rem 0; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>🔌 API de Cadastro de Usuários</h1>
        <p>Interface de teste — conecta em <code>api.php</code> local</p>
    </div>

    <a href="../../index.html" class="back-link">
        ← Voltar ao portfólio
    </a>
</header>

<div class="container">

    <div class="grid2">

        <!-- Cadastro -->
        <div class="card">
            <h2>📝 Cadastrar Usuário</h2>
            <label>Nome</label>
            <input id="regName" type="text" placeholder="Arthur Ramos">
            <label>E-mail</label>
            <input id="regEmail" type="email" placeholder="arthur@email.com">
            <label>Senha</label>
            <input id="regPass" type="password" placeholder="mínimo 6 caracteres">
            <button class="btn" onclick="register()">Cadastrar</button>
        </div>

        <!-- Login -->
        <div class="card">
            <h2>🔐 Login</h2>
            <label>E-mail</label>
            <input id="loginEmail" type="email" placeholder="arthur@email.com">
            <label>Senha</label>
            <input id="loginPass" type="password" placeholder="sua senha">
            <button class="btn" onclick="login()">Entrar</button>
        </div>

    </div>

    <!-- Lista de usuários -->
    <div class="card">
        <h2>👥 Usuários Cadastrados <button class="btn outline" style="width:auto;margin:0;padding:.3rem .8rem;font-size:.75rem;" onclick="listUsers()">↻ Atualizar</button></h2>
        <div id="usersContainer"><p class="empty-users">Clique em "Atualizar" para carregar.</p></div>
    </div>

    <!-- Response log -->
    <div class="response-box">
        <h3>📡 Última resposta da API</h3>
        <pre id="responseLog">—</pre>
    </div>

</div>

<script>
const API = 'api.php';

function showResponse(data, status) {
    const badge = status >= 200 && status < 300
        ? `<span class="status-badge ok">✓ ${status}</span>`
        : `<span class="status-badge err">✕ ${status}</span>`;
    document.querySelector('.response-box h3').innerHTML = `📡 Última resposta ${badge}`;
    document.getElementById('responseLog').textContent = JSON.stringify(data, null, 2);
}

async function apiFetch(url, options = {}) {
    const res = await fetch(url, options);
    const data = await res.json();
    showResponse(data, res.status);
    return { data, ok: res.ok };
}

async function register() {
    const name  = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;
    await apiFetch(`${API}?action=register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password }),
    });
    listUsers();
}

async function login() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    await apiFetch(`${API}?action=login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
    });
}

async function listUsers() {
    const { data, ok } = await apiFetch(`${API}?action=users`);
    const container = document.getElementById('usersContainer');
    if (!ok || !data.users?.length) {
        container.innerHTML = '<p class="empty-users">Nenhum usuário cadastrado ainda.</p>';
        return;
    }
    container.innerHTML = `
        <table class="users-table">
            <thead><tr><th>#</th><th>Nome</th><th>E-mail</th><th>Criado em</th><th></th></tr></thead>
            <tbody>
                ${data.users.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>${u.created_at}</td>
                        <td><button class="btn-del" onclick="deleteUser(${u.id})">Remover</button></td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

async function deleteUser(id) {
    if (!confirm(`Remover usuário #${id}?`)) return;
    await apiFetch(`${API}?action=delete&id=${id}`, { method: 'DELETE' });
    listUsers();
}
</script>

</body>
</html>
